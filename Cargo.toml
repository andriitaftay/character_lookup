[package]
name = "character_lookup"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", features = ["wayland-data-control", "wl-clipboard-rs"] }
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
chinese_dictionary = "2.1.8"
fontdb = "0.24.0"
futures-util = "0.3.34"
image = "0.25.10"
imageproc = "0.25"
minifb = "0.29.0"
# rapidocr-core 0.2.2 only compiles against ort 2.0.0-rc.12; newer rc releases
# changed the Session::builder API. Pin it so a fresh resolution cannot break.
ort = "=2.0.0-rc.12"
rapidocr-core = { version = "0.2.2", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "time", "macros"] }
toml = "1.1.6"
